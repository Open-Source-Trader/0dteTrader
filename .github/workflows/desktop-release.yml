name: Desktop Release

on:
  push:
    branches: [main]

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-dmg:
    runs-on: macos-14
    permissions:
      contents: read
    outputs:
      release_version: ${{ steps.meta.outputs.release_version }}
      release_sha: ${{ steps.meta.outputs.release_sha }}
      release_tag: ${{ steps.meta.outputs.release_tag }}
      release_name: ${{ steps.meta.outputs.release_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Compute release metadata
        id: meta
        run: |
          VERSION=$(node -p "require('./apps/desktop/package.json').version")
          SHORT_SHA=${GITHUB_SHA::12}
          {
            echo "release_version=$VERSION"
            echo "release_sha=$SHORT_SHA"
            echo "release_tag=desktop-v${VERSION}-${SHORT_SHA}"
            echo "release_name=0dteTrader Desktop ${VERSION} (${SHORT_SHA})"
          } >> "$GITHUB_OUTPUT"

      - name: Build shared types
        run: npm run build --workspace packages/shared-types

      - name: Build desktop app
        run: npm run build --workspace apps/desktop
        env:
          # Vite embeds this value in the About screen at bundle time. Setting
          # it only for electron-builder would leave every release labelled
          # "development" even though the DMG filename carries the real SHA.
          RELEASE_SHA: ${{ steps.meta.outputs.release_sha }}

      - name: Package macOS DMG
        run: npm run dist:mac --workspace apps/desktop
        env:
          RELEASE_SHA: ${{ steps.meta.outputs.release_sha }}

      - name: Upload DMG artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: desktop-dmg-${{ steps.meta.outputs.release_tag }}
          path: apps/desktop/release/*.dmg
          if-no-files-found: error

  publish-release:
    runs-on: ubuntu-latest
    needs: build-dmg
    permissions:
      contents: write
    steps:
      - name: Download DMG artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: desktop-dmg-${{ needs.build-dmg.outputs.release_tag }}
          path: release-assets

      - name: Publish GitHub release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65
        with:
          tag_name: ${{ needs.build-dmg.outputs.release_tag }}
          name: ${{ needs.build-dmg.outputs.release_name }}
          generate_release_notes: true
          files: release-assets/*.dmg
