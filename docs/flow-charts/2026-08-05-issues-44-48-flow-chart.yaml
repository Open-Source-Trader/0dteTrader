    - { id: T47A, label: New options analytics capture arrives, type: event }
    - { id: T47B, label: Build paired-strike IV values and exact or bracket spot, type: decision }
    - { id: T47C, label: Persist nullable interpolated ATM IV with bumped version, type: process }
    - {
        id: T47D,
        label: Validate RTH symbol monotonic time warmup gap and cooldown,
        type: decision,
      }
    - { id: T47E, label: Advance median MAD streak and persisted per-user state, type: process }
    - { id: T47F, label: Emit user-scoped expansion or crush alert banner, type: output }
    - {
        id: T47G,
        label: Ignore closed unsupported null duplicate or old capture without detector mutation,
        type: output,
      }
    - {
        id: T47H,
        label: Suppress alert while atomically applying the specified gap warmup cooldown or streak progress update,
        type: output,
      }
    - { id: T48A, label: User requests auto_scored with preset or edited preferences, type: event }
