    - {
        id: TARGET_FLOW,
        label: Approved implementation behavior and completion gates,
        type: target_state,
      }
  edges:
    - {
        from: CURRENT_FLOW,
        to: TARGET_FLOW,
        condition: approved issues 44 45 47 and 48 implementation,
      }
  detailed_sections: [current_flow, target_flow]

