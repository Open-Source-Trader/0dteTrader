actual_events_by_step:
  - {
      step: 1,
      event: Registry load,
      outcome: Both clients use the same descriptor contract and migrated settings.,
    }
  - {
      step: 2,
      event: L2 subscription,
      outcome: Entitled Webull book is bounded derived and published or a truthful unavailable state is published.,
    }
  - {
      step: 3,
      event: New capture,
      outcome: ATM IV is exact/interpolated or null and detector state advances once.,
    }
  - {
      step: 4,
      event: Scored Auto request and submit,
      outcome: Explainable rank is confirmed and freshly revalidated before broker send.,
    }
  - {
      step: 5,
      event: Completion review,
      outcome: All tests,
      measurements,
      documentation,
      device evidence,
      and issue comment are present.,
    }

all_possible_events_by_step:
  - step: 1
    possible_events:
      [
        valid registry,
        invalid registry,
        legacy settings,
        keyed settings,
        valid pane request,
        third pane,
        finite geometry,
        invalid geometry,
      ]
    outcomes: [render, migrate once, reject with shared message, fail safe without partial state]
  - step: 2
    possible_events:
      [
        subscribe,
        duplicate subscribe,
        refresh,
        rate wait,
        provider success,
        entitlement failure,
        stale book,
        unsubscribe,
        disconnect,
        day reset,
        shutdown,
      ]
    outcomes:
      [coalesce, publish snapshot, publish No L2 data, teardown resources, reset bounded state]
  - step: 3
    possible_events:
      [
        exact strike,
        bracket interpolation,
        missing leg,
        no bracket,
        closed session,
        old capture,
        gap,
        warmup,
        breach,
        cooldown,
      ]
    outcomes: [persist ATM IV, persist null, reset state, suppress, emit one scoped alert]
  - step: 4
    possible_events:
      [
        preset,
        edited preferences,
        missing data,
        no pass,
        scored pass,
        fallback acknowledgment,
        confirmation,
        fresh rerank change,
      ]
    outcomes: [explain result, warn, Classic fallback, accept order, reject before broker]

failure_recovery_paths:
  - failure: Registry decode or schema mismatch
    detection: Registry validation and client decode tests
    retry_timeout_fallback: Do not apply partial settings; show stable unavailable/error state.
    terminal_outcome: No inconsistent indicator render.
  - failure: Provider entitlement or request failure
    detection: Capability probe, HTTP response, timeout, and metrics
    retry_timeout_fallback: Obey one-per-second limiter; publish No L2 data; tear down on terminal provider failure.
    terminal_outcome: No fabricated book and no leaked timer.
  - failure: Invalid or discontinuous ATM IV series
    detection: Pair/bracket validation, timestamp monotonicity, gap guard, finite MAD guard
    retry_timeout_fallback: Persist null/reset/progress state; wait for a new valid capture.
    terminal_outcome: No stale or non-finite alert.
  - failure: Candidate becomes stale or ranking changes
    detection: Server-side fresh refetch, rerank, and equality/freshness validation
    retry_timeout_fallback: Reject with actionable reason; user requests a new ranking.
    terminal_outcome: No broker order sent.
  - failure: Completion evidence unavailable
    detection: Checking-plan gate lacks physical Energy Log or GitHub comment URL.
    retry_timeout_fallback: Keep implementation ready but status incomplete until external evidence exists.
    terminal_outcome: Completion is not claimed.

inputs_transformations_outputs_side_effects:
  inputs:
    [
      registry JSON,
      candles and volume,
      L1 quotes,
      Webull books,
      options chains,
      spot,
      captures,
      user preferences,
      broker quotes,
      websocket lifecycle events,
    ]
  transformations:
    [
      schema validation,
      migration,
      indicator calculation,
      rate limiting,
      coalescing,
      book normalization,
      interpolation,
      median MAD detection,
      filtering,
      normalization,
      deterministic scoring,
      fresh reranking,
    ]
  outputs:
    [
      generic geometry,
      L2 snapshot or No L2 data,
      scoped IV alert,
      ranked Auto result,
      accepted or rejected order,
    ]
  side_effects:
    [
      settings writes,
      timers,
      provider requests,
      bounded session state,
      Prisma writes,
      websocket messages,
      metrics and structured logs,
      broker order only after validation,
    ]

invariants:
  preconditions:
    [
      authenticated user for user-scoped paths,
      validated public DTOs,
      explicit New York session clock,
      finite market values,
    ]
  postconditions:
    [
      bounded resources,
      deterministic outputs,
      explicit unavailable reasons,
      persisted monotonic alert state,
      broker send only after fresh validation,
    ]
  must_never_happen:
    [
      more than two subpanes,
      Tradier represented as L2,
      Webull rate above one request per second per app key,
      missing L2 represented as zero,
      ATM IV extrapolation,
      cross-user alert delivery,
      silent Classic fallback,
      scored Auto bypassing confirmation,
      broker send after stale rerank,
    ]

risk_review:
  user_behavior_breaks:
    [
      rapid toggles could exceed pane limits,
      rapid symbol changes could leave stale subscriptions,
      repeated submits could race reranking,
    ]
  production_traffic_breaks:
    [
      provider throttling,
      timer leaks,
      websocket fanout,
      database detector write contention,
      candidate quote fanout,
    ]
  weird_data_breaks:
    [
      crossed or one-sided books,
      duplicate strikes,
      missing option legs,
      zero mids,
      equal score dimensions,
      zero MAD,
      non-finite Greeks,
    ]
  concurrency_time_order_breaks:
    [
      NY day and DST changes,
      late provider responses,
      unsubscribe during inflight fetch,
      duplicate captures,
      restart backfill,
      quote change between rank and submit,
    ]

cleanup_requirements:
  remove_dead_code: true
  remove_backwards_compatibility_paths: true
  update_related_files:
    [
      shared contracts and fixtures,
      API modules and Prisma,
      desktop and iOS engines stores sockets and views,
      OpenAPI architecture API runbook and privacy docs,
      automated and device evidence,
    ]
