          failure: unauthorized or invalid settings,
          handling: reject without state mutation,
          resulting_state: capture_persisted,
        }
  - id: IV-4S
    from_state: detector_suppressed
    trigger_event: iv_alert_configure
    guard_conditions: [authenticated owner, allowed symbols, validated bounded settings]
    transformations: [merge or replace user preferences]
    to_state: detector_suppressed
