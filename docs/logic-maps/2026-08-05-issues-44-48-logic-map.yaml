        }
  - id: IV-4E
    from_state: alert_emitted
    trigger_event: iv_alert_configure
    guard_conditions: [authenticated owner, allowed symbols, validated bounded settings]
    transformations: [merge or replace user preferences]
    to_state: alert_emitted
    outputs: [configuration acknowledgment]
    side_effects: [upsert per-user preferences]
    failure_paths:
      - {
          failure: unauthorized or invalid settings,
          handling: reject without state mutation,
          resulting_state: alert_emitted,
        }
  - id: AUTO-1
    from_state: auto_preferences_ready
    trigger_event: auto_rank_request
    guard_conditions: [authenticated owner, mode auto_scored, selected symbol and preferences valid]
    transformations:
      [
        load Conservative Aggressive or edited persisted preferences,
        fetch Tradier analytics and active-broker executable quotes,
      ]
    to_state: auto_assembling
    outputs: [candidates_assembled]
    side_effects: [candidate request metrics]
    failure_paths:
      - {
          failure: unauthorized provider failure or stale source,
          handling: return no-pass with reason and no implicit fallback,
          resulting_state: auto_no_pass,
        }
  - id: AUTO-2
    from_state: auto_assembling
    trigger_event: candidates_assembled
    guard_conditions:
      [
        assembled candidate collection present,
        validated preferences present,
        authoritative server time present,
      ]
    transformations:
      [
        for each candidate independently validate expiration option type strike rung quote and analytics freshness required bid ask delta gamma IV and OI consistency and hard spread premium and OI limits,
        derive mid as bid plus ask divided by two while ignoring provider mid,
        retain an exclusion reason for every rejected candidate,
        use absolute put delta,
        normalize the remaining dimensions to zero-one with equal-value equality,
        score gamma seek or avoid and lower IV versus the passing-candidate median,
        sort remaining candidates at full precision by score spread OI ATM distance symbol,
      ]
    to_state: auto_ranked
    outputs: [winner rationale runners-up exclusions and freshness]
    side_effects: [ranking and exclusion metrics]
    failure_paths:
      - {
          failure: zero passing candidates,
          handling: return visible warning requiring preference change or explicit Classic acknowledgment,
          resulting_state: auto_no_pass,
        }
  - id: AUTO-3
    from_state: auto_ranked
    trigger_event: user_selects_ranked_winner
    guard_conditions: [explicit scored-Auto confirmation captured even when global bypass enabled]
    transformations: [build submit DTO with selected symbol exact preferences and no fallback]
    to_state: auto_awaiting_confirmation
    outputs: [confirmation state]
    side_effects: []
    failure_paths:
      - {
          failure: confirmation absent,
          handling: block submission,
          resulting_state: order_rejected,
        }
  - id: AUTO-4
    from_state: auto_no_pass
    trigger_event: user_requests_classic_fallback
    guard_conditions: [explicit fallback acknowledgment captured]
    transformations:
      [
        select retained Classic plus-one mode under existing Classic behavior without scored weights ranking or winner equality,
      ]
    to_state: classic_revalidating
    outputs: [acknowledged Classic fallback submission]
    side_effects: [fallback acknowledgment audit metric]
    failure_paths:
      - {
          failure: acknowledgment absent,
          handling: block fallback,
          resulting_state: order_rejected,
        }
  - id: AUTO-5
    from_state: auto_awaiting_confirmation
    trigger_event: auto_order_submit
    guard_conditions:
      [
        authenticated owner,
        exact scored preferences present,
        mode auto_scored,
        explicit scored confirmation present regardless of global bypass,
      ]
    transformations:
      [
        refetch analytics and active-broker quotes,
        reconstruct candidates,
        rerun the canonical scorer,
      ]
    to_state: auto_revalidating
    outputs: [fresh_rerank_completed]
    side_effects: [freshness and rerank metrics]
    failure_paths:
      - {
          failure: source failure or stale data,
          handling: reject before broker send,
          resulting_state: order_rejected,
        }
  - id: AUTO-6
    from_state: auto_revalidating
    trigger_event: fresh_rerank_completed
    guard_conditions:
      [
        mode is auto_scored,
        requested contract is still the unique canonical winner,
        all hard filters freshness checks confirmation and trading controls pass,
      ]
    transformations: [create existing idempotent broker order command]
    to_state: order_accepted
    outputs: [accepted order result]
    side_effects: [broker order send and audit record]
    failure_paths:
      - {
          failure: winner changed candidate invalid stale or confirmation mismatch,
          handling: reject with actionable reason before broker call,
          resulting_state: order_rejected,
        }
  - id: AUTO-7
    from_state: classic_revalidating
    trigger_event: auto_order_submit
    guard_conditions:
      [
        authenticated owner,
        mode auto_otm,
        explicit fallback acknowledgment present when entered from scored no-pass,
      ]
    transformations:
      [
        resolve Classic plus-one contract using the existing live Classic validation and confirmation policy,
        without invoking the scored candidate service,
      ]
    to_state: order_accepted
    outputs: [accepted Classic order result]
    side_effects: [broker order send and audit record through existing idempotent controls]
    failure_paths:
      - {
          failure: Classic contract absent invalid or existing confirmation control fails,
          handling: reject before broker send,
          resulting_state: order_rejected,
        }
  - id: AUTO-8
    from_state: auto_no_pass
    trigger_event: auto_rank_request
    guard_conditions:
      [authenticated owner, edited or newly selected preferences pass every normative bound]
    transformations:
      [
        persist valid preference update when requested,
        fetch a new candidate snapshot,
        never carry forward a prior fallback acknowledgment,
      ]
    to_state: auto_assembling
    outputs: [candidates_assembled]
    side_effects: [preference and retry metrics]
    failure_paths:
      - {
          failure: invalid preferences or stale unavailable sources,
          handling: remain no-pass with field or source reasons,
          resulting_state: auto_no_pass,
        }
  - id: GATE-1
    from_state: verification_incomplete
    trigger_event: completion_review
    guard_conditions:
      [
        all automated suites pass,
        no open P0 or P1,
        parity within tolerance,
        payload and decoder evidence recorded,
        physical iPhone Energy Log recorded,
        authenticated GitHub issue 45 comment URL recorded,
      ]
    transformations: [audit artifacts docs code tests warnings findings and cleanup residues]
    to_state: complete
    outputs: [completion evidence]
    side_effects: [update paired checking plan]
    failure_paths:
      - {
          failure: any test finding cleanup or external gate missing,
          handling: remain incomplete and record exact blocker,
          resulting_state: verification_incomplete,
        }

actual_event_paths:
  - chart_started -> registry_validated -> keyed settings migration or validation -> maximum-two-pane guard -> pure geometry -> generic paired rendering
  - l2_subscribe -> entitlement probe -> coalesced global rate slot -> Webull fetch -> bounded NY-session state -> derived indicators -> fanout -> unsubscribe/disconnect -> complete teardown
  - analytics_capture -> paired-strike IV -> exact/interpolated atmIv persistence -> RTH monotonic detector -> streak/cooldown decision -> scoped banner or suppression
  - auto_rank_request -> authenticated data merge -> hard filter -> deterministic rank -> visible explanation -> explicit confirmation -> fresh server rerank -> broker accept or reject

all_possible_event_paths:
  - Registry invalid, migration fails, parameters invalid, pane count exceeds two, geometry non-finite, or unknown geometry kind -> preserve last valid state and reject clearly.
  - L2 unsupported, unentitled, throttled, stale, invalid, provider-failed, unsubscribed, disconnected, day-reset, or shutdown -> No L2 data and bounded idempotent teardown.
  - ATM IV exact, interpolated, missing pair, no bracket, null, closed, duplicate, out-of-order, warmup, gap, breach, direction change, cooldown, disconnected delivery -> persist one monotonic safe outcome and never replay stale alerts.
  - Auto preset, edited preferences, partial candidate, zero mid, equal dimensions, tie, no pass, fallback rejected/acknowledged, confirmation absent/present, rerank changed, broker controls failed -> visible deterministic result and no unsafe broker send.

invariants:
  preconditions:
    [
      registry and DTO schema validation precedes mutation,
      user identity precedes user-scoped access,
      market timestamps use explicit New York session policy,
      order scoring uses finite fresh values,
    ]
  postconditions:
    [
      settings and detector writes are atomic,
      provider and timer state is bounded,
      output availability is explicit,
      rankings are deterministic,
      broker sends are freshly validated,
    ]
  must_never_happen:
    [
      more than two chart subpanes,
      TWC semantic drift,
      L2 zero fabrication,
      Webull request rate above one per second per app key,
      Level 2 attributed to Tradier,
      cross-user state or alert access,
      ATM IV extrapolation,
      infinite MAD score,
      duplicate restart alert,
      silent fallback,
      scored confirmation bypass,
      stale candidate order,
    ]

risk_review:
  user_behavior_breaks:
    [
      rapid chart settings toggles,
      duplicate subscriptions,
      rapid symbol switches,
      repeated alert configuration,
      stale confirmation dialogs,
    ]
  production_traffic_breaks:
    [
      global rate starvation,
      fanout amplification,
      abandoned timers,
      capture lock contention,
      active-broker quote bursts,
    ]
  weird_data_breaks:
    [
      duplicate registry ids,
      empty candles,
      one-sided/crossed books,
      duplicate option strikes,
      missing legs,
      zero mids,
      equal-value normalization,
      zero MAD,
    ]
  concurrency_time_order_breaks:
    [
      late depth responses after unsubscribe,
      NY midnight DST and early-close changes,
      multiple capture workers,
      websocket reconnect,
      quote movement after client ranking,
    ]

validation:
  tests_required:
    - shared registry schema and shared TypeScript/Swift fixture parity at 1e-6
    - fake-clock L2 rate coalescing bounds staleness reset and teardown tests
    - ATM IV exact interpolation and detector state-machine/restart isolation tests
    - scorer golden fixture property tests and trading fresh-rerank e2e tests
    - desktop and iOS presentation accessibility persistence and confirmation tests
    - strict type lint format build Prisma migration and full regression suites
    - automated payload/decoder measurements and 15-minute physical-iPhone Energy Log
  observability_required:
    [
      structured provider/lifecycle/detector/scorer/order logs,
      bounded resource gauges,
      error latency staleness coalescing alert and rerank metrics,
    ]

cleanup_requirements:
  remove_dead_code: true
  remove_backwards_compatibility_paths: true
  update_related_files:
    - shared types registry fixtures and package exports
    - API gateway provider analytics detector scorer trading Prisma and module wiring
    - desktop and iOS engines stores sockets controls views and tests
    - OpenAPI API architecture runbook roadmap privacy and provider documentation
