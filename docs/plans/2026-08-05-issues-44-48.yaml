  cleanup_and_removals: Remove replaced flat settings, manual dispatch/render branches, duplicated contract shapes, old Auto-offset stores and profile rows, obsolete comments/tests/docs, and temporary migration code only after its persisted-version contract is satisfied.
  no_backwards_compatibility_confirmation: No runtime compatibility shim will remain; only an idempotent one-time persisted-data migration is allowed.

flow_description:
  required_format: inputs -> transformations -> outputs -> side effects
  inputs:
    [
      registry and persisted settings,
      candles and volume,
      L1 quotes and Webull books,
      option chains and captures,
      user preferences,
      active-broker quotes,
      websocket/order events,
    ]
  transformations:
    [
      validate/migrate,
      pure indicator geometry,
      rate-limit/coalesce/normalize,
      paired-strike interpolation,
      median-MAD state machine,
      hard-filter/normalize/rank,
      fresh rerank,
    ]
  outputs:
    [
      paired chart geometry,
      L2 snapshot or No L2 data,
      scoped IV alert,
      explained ranking,
      accepted or rejected order,
    ]
  side_effects:
    [
      atomic settings and Prisma writes,
      bounded timers/history,
      provider calls,
      websocket messages,
      metrics/logs,
      broker send only after fresh confirmation,
    ]

invariants:
  preconditions:
    [
      schema-validated input,
      authenticated ownership for user paths,
      explicit NY session clock,
      finite fresh values for calculations,
    ]
  postconditions:
    [
      desktop/iOS parity,
      bounded lifecycle state,
      monotonic detector state,
      deterministic rankings,
      explicit unavailable states,
    ]
  must_never_happen:
    [
      third subpane,
      TWC drift,
      L2 attributed to Tradier,
      provider over one request per second per app key,
      missing data rendered as zero,
      ATM IV extrapolation,
      cross-user alert,
      silent fallback,
      scored confirmation bypass,
      stale broker order,
    ]

locked_domain_decisions:
  indicators:
    settings_precedence: valid current keyed record, else atomic recognized-legacy migration, else registry defaults
    invalid_behavior: Unknown out-of-range or non-finite inputs/outputs reject the mutation and preserve the last valid state.
  l2:
    distributed_rate_limit: Redis atomic lease/token-bucket keyed by Webull app key; grants are at least one second apart across API replicas.
    history_bounds: At most 23400 valid one-second prior samples in the current NY RTH session; reset on NY session change.
    formulas: Use the exact spread percentile imbalance tick-pressure cumulative-pressure and depletion formulas/ties in the source spec.
    lifecycle: Every active state supports last-unsubscribe disconnect terminal-failure shutdown and NY-reset cancellation; fresh state loops through the distributed limiter for each refresh.
  iv_detector:
    baseline: Prior samples only; current sample excluded; raw MAD without multiplier.
    score: Signed current-minus-median over MAD clamped to [-20,20]; zero MAD maps equal to 0 and non-equal to signed 20.
    boundaries: Expansion is score >= k, crush is score <= -k, direction changes restart streak, and timestamp exactly at cooldownUntil is eligible.
  auto_scored:
    conservative:
      {
        target_abs_delta: 0.25,
        strike_rungs: 5,
        max_spread_bps: 500,
        max_premium_dollars: 250,
        min_open_interest: 100,
        gamma_mode: avoid,
        weights: { delta: 0.30, spread: 0.25, open_interest: 0.20, gamma: 0.10, iv: 0.15 },
      }
    aggressive:
      {
        target_abs_delta: 0.40,
        strike_rungs: 8,
        max_spread_bps: 1000,
        max_premium_dollars: 500,
        min_open_interest: 25,
        gamma_mode: seek,
        weights: { delta: 0.25, spread: 0.15, open_interest: 0.15, gamma: 0.30, iv: 0.15 },
      }
    normalization: Higher-desirability min-max per dimension; every candidate gets 1 for a constant domain; validated weights are normalized to sum 1.
    freshness: Broker quote age at most 5 seconds, future skew at most 2 seconds, analytics age at most 60 seconds.
    path_split: Scored submissions rerank and require scored confirmation; acknowledged Classic fallback uses existing auto_otm plus-one validation and never enters scored reranking.
    prisma_model: AutoScoringPreference has UUID id/user relation, schemaVersion 1, preset and all numeric/gamma/weight fields, timestamps, unique userId, cascade delete, and transactional migration; first read materializes Conservative v1.

focused_brainstorming_pass_before_finalize:
  required: true
  scoped_code_paths:
    [
      packages/shared-types,
      apps/api/src/market-data,
      apps/api/src/options-analytics,
      apps/api/src/trading,
      apps/api/prisma,
      apps/desktop/src/features/chart,
      apps/desktop/src/features/trade,
      apps/ios/0dteTrader/Features/Chart,
      apps/ios/0dteTrader/Features/Trade,
    ]
  prompts:
    - 'what would user behavior break?'
    - 'what would production traffic break?'
    - 'what would weird data break?'
    - 'what would concurrency/time/order break?'
  identify_and_record:
    logical_flaws:
      - Current ATM IV nearest-strike choice is not ATM interpolation.
      - Client-selected Auto cannot remain authoritative at order time.
    logical_gaps:
      - Missing entitlement and stale books need explicit non-zero unavailable states.
      - Restart/backfill and gap behavior need persisted detector state.
    contract_violations:
      - Desktop and iOS indicator settings/formulas drift and current public selection mode lacks auto_scored.
      - Websocket contract currently has no L2 or IV configuration/alert messages.
    risk_hotspots:
      [
        provider global rate and teardown,
        cross-language numeric parity,
        New York clock boundaries,
        Prisma uniqueness/atomicity,
        active-broker freshness,
        confirmation bypass,
      ]
  risk_conversion:
    - {
        risk: provider overload or leak,
        change: global limiter coalescing bounds lifecycle metrics and fake-clock tests,
      }
    - {
        risk: calculation drift,
        change: pure engines and shared golden fixtures across TypeScript and Swift,
      }
    - {
        risk: stale/duplicate alert,
        change: monotonic persisted state gap reset cooldown and restart tests,
      }
    - {
        risk: unsafe contract,
        change: hard filters explanation explicit confirmation and server fresh rerank e2e,
      }

