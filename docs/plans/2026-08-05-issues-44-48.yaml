self_questioning_and_solution_selection:
  required: true
  guiding_questions:
    - What public contracts must be identical across API, desktop, and iOS?
    - Which calculations can be pure and fixture-driven before UI or persistence work?
    - Where can missing or stale market data cause fabricated confidence?
    - Which resources need hard bounds and teardown under rapid user behavior?
    - Which server validation must remain authoritative immediately before an order?
  brainstorm_candidate_solutions:
    min_options: 3
    options:
      - option_id: O1
        summary: Patch each client and current service independently.
        tradeoffs:
          {
            pros: [small local diffs],
            cons: [preserves drift, duplicates formulas, weak lifecycle authority],
          }
      - option_id: O2
        summary: Build a new monolithic analytics and trading subsystem.
        tradeoffs:
          {
            pros: [single server package],
            cons: [high rewrite risk, mixes unrelated lifecycle domains, difficult rollback],
          }
      - option_id: O3
        summary: Use shared versioned contracts and fixtures, pure domain engines, focused provider/persistence services, and thin paired-client adapters.
        tradeoffs:
          {
            pros: [deterministic parity, bounded ownership, testable seams, coordinated cleanup],
            cons: [requires coordinated breaking migration across multiple packages],
          }
  selected_solution:
    option_id: O3
    why_best: It makes the server authoritative where state and execution matter, keeps calculations pure and portable, provides honest unavailable states, and removes duplicated runtime paths without an unnecessary rewrite.
  ambiguity_protocol:
    if_still_ambiguous: true
    question_strategy:
      [
        Stop only for a choice that changes an approved contract or needs new external authority; otherwise use repository evidence and the locked spec.,
      ]

