objective:
  restated:
    - Build one canonical indicator registry and generic cross-platform engine/rendering path with the approved indicators, unchanged TWC, two-subpane enforcement, and shared numeric parity.
    - Add entitlement-aware, rate-safe, bounded Webull stock/ETF Level 2 with truthful unavailable states, derived microstructure indicators, complete lifecycle teardown, and operational evidence.
    - Correct and persist exact/interpolated ATM IV, then add restart-safe per-user SPX/NDX/RUT RTH expansion/crush alerts using a pure median/MAD detector.
    - Add explainable deterministic scored Auto selection with persisted presets, hard filters, fresh server reranking, explicit fallback acknowledgment, and mandatory confirmation.
    - Remove obsolete flat settings, duplicated dispatch/render paths, and old Auto offset storage/UI without leaving compatibility shims or dead code.
    - Pass strict types, lint, format, builds, migrations, complete automated tests, payload/decoder measurements, physical-iPhone Energy Log, and the GitHub #45 capability-comment gate.
    - Treat deleted issue #46 as withdrawn and do not infer or implement missing requirements.

