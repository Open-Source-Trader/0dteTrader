  target_state: Shared registry and fixtures, dedicated truthful L2 lifecycle, exact/interpolated persisted ATM IV with scoped alerts, and explainable scored Auto with fresh server authority.
  current_logic_flow: docs/flow-charts/2026-08-05-issues-44-48-flow-chart.yaml#current_flow
