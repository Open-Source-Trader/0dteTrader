NEW_TASK_CHECK_LIST:
  - Validate and freeze shared contracts registry and fixtures before consumers.
  - Implement every behavior with a failing focused test first and preserve RED/GREEN evidence.
  - Review each task for spec compliance then code quality before advancing.
  - Keep L2 resources rate-safe bounded truthful and leak-free.
  - Keep IV detector time-ordered persisted user-scoped and replay-safe.
  - Keep Auto ranking deterministic explainable confirmed and freshly server-validated.
  - Remove obsolete paths and update all public and operational docs.
  - Run full automated verification plus required physical-device and GitHub external gates.

