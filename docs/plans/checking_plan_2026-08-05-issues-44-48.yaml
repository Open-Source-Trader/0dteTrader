    minimal_fix: Use a discriminated selection union with Classic-owned fallback acknowledgment, correct and label prior-only history, add required edge vectors and full Auto rationale/tie/filter cases, and add deep runtime plus compile-time contract validation. Preserve otmOffset only as a staged auto_otm field until coordinated T8 deletion across all consumers.
