live_findings:
  - id: PLAN-001
    severity: P1
    description: Initial umbrella artifacts left domain machines and several normative branches under-specified, including terminal-state contradictions, active-state L2 teardown/repeat/reset, distributed rate authority, L2 formulas, detector boundaries, Auto numeric scoring/freshness/Classic split, indicator default branch, and Auto Prisma shape.
    file: docs/specs/2026-08-05-issues-44-48-spec.md and paired YAML artifacts
    symbol_or_call_path: normative requirements, state_model, transitions, locked_domain_decisions
    reproduction_steps: Compare the first artifact draft against the approved requirements and enumerate undeclared triggers and ambiguous calculations.
    impact_to_intended_output_or_invariants: Implementers could produce divergent formulas, a cross-replica rate violation, incomplete teardown, stale alerts, or route acknowledged Classic fallback through scored reranking.
    minimal_fix: Define four independent machines plus delivery gate, declare triggers, make lifecycle paths exhaustive, select Redis global limiting, lock formulas/defaults/boundaries/freshness/persistence, and update plan tests.
    blocker: true
    remediation_status: superseded-by-PLAN-002-after-independent-rereview
  - id: PLAN-002
    severity: P1
    description: Independent re-review found that recurring indicator and IV states, L2 denied-slot/retry/partial-unsubscribe behavior, new-indicator formulas/defaults, detector timing boundaries, scorer input and preference bounds, Auto no-pass retry, and clean-checkout verification commands were still incomplete.
    file: docs/specs/2026-08-05-issues-44-48-spec.md, docs/logic-maps/2026-08-05-issues-44-48-logic-map.yaml, and docs/plans/2026-08-05-issues-44-48.yaml
    symbol_or_call_path: normative indicator contract, state_model and transitions, T1/T2/T9 commands
    reproduction_steps: Run the second independent review, execute the stated shared-types test command, and attempt clean iOS generation without a pre-generated environment file.
    impact_to_intended_output_or_invariants: Cross-language fixtures could encode different algorithms, recurring streams could dead-end, retries could stop permanently, and required checks could fail before exercising the implementation.
    minimal_fix: Lock exact formulas/defaults/bounds/timing, add recurring and retry transitions, separate partial and final unsubscribe, add a Node shared-types test runner, bootstrap environment before XcodeGen, and pin the simulator id.
    blocker: true
    remediation_status: superseded-by-PLAN-003-after-final-review
  - id: PLAN-003
    severity: P1
    description: Final artifact review found active-state L2 joins and stale retry were incomplete, several IV suppression branches incorrectly shared persistence semantics and configuration was initially unreachable, Auto required a provider mid and rejected the whole set for one malformed candidate, optimistic-concurrency test scope was absent, and the flow chart omitted its required template section.
    file: docs/flow-charts/2026-08-05-issues-44-48-flow-chart.yaml, docs/logic-maps/2026-08-05-issues-44-48-logic-map.yaml, and docs/plans/2026-08-05-issues-44-48.yaml
    symbol_or_call_path: flow_chart, L2-1/L2-5/L2-14*, IV-2/IV-4*, AUTO-2, and T7
    reproduction_steps: Trace new subscriber, stale retry, configuration, invalid capture, and malformed-candidate paths from every live state and compare the flow artifact with its event-driven template.
    impact_to_intended_output_or_invariants: A live L2 stream could reject later subscribers or stop permanently, detector state could mutate on ignored captures, users could not configure alerts before suppression, valid Auto candidates could be hidden, and stale preference writes could silently win.
    minimal_fix: Add per-active-state subscriber joins and scheduled retry, split IV mutation branches and configuration self-transitions, derive mid from bid/ask and exclude malformed candidates independently, add stale-write conflict tests, and restore the flow_chart template section.
    blocker: true
    remediation_status: superseded-by-PLAN-004-after-independent-confirmation
  - id: PLAN-004
    severity: P1
    description: Independent confirmation found that AUTO-2 still guarded as if every candidate passed, successful L2 fetches did not explicitly arm refresh and stale timers, terminal L2 teardown could retain subscribers or leave failed cleanup in an unscheduled state, and the high-level IV flow still conflated ignored captures with state-mutating suppression.
    file: docs/flow-charts/2026-08-05-issues-44-48-flow-chart.yaml and docs/logic-maps/2026-08-05-issues-44-48-logic-map.yaml
    symbol_or_call_path: T47G/T47H, L2-2/L2-4/L2-7/L2-8/L2-11, and AUTO-2
    reproduction_steps: Trace a mixed valid-invalid Auto set, a successful L2 response, a terminal failure with active subscribers, a failed teardown cleanup, and each ignored or suppressed IV capture.
    impact_to_intended_output_or_invariants: Valid Auto candidates could be hidden, L2 polling could stop after one success, terminal failures could leak registrations or deadlock teardown, and ignored IV captures could incorrectly mutate persisted detector state.
    minimal_fix: Validate candidates independently inside AUTO-2, arm both L2 timers on success, atomically clear terminal registrations and retry teardown in place, and split ignored versus mutating IV suppression in the target flow.
    blocker: true
    remediation_status: remediated-and-independently-approved
  - id: T1-001
    severity: P1
    description: T1 passed its initial tests but the spec review found an unrepresentable acknowledged Classic fallback, incorrect cumulative-pressure golden math, insufficient indicator ATM-IV and Auto edge/rationale coverage, and shallow fixture/compile contract validation.
    file: packages/shared-types/src/index.ts, packages/shared-types/fixtures/indicator-parity-v1.json, packages/shared-types/fixtures/auto-scoring-v1.json, and packages/shared-types/test/contracts.test.mjs
