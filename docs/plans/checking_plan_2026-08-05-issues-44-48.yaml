required_context_files_read_first:
  purpose: Check implementation against the approved requirement, current/target flow, guarded state, repository, provider, client, persistence, and execution contracts.
  core_required:
    - { path: AGENTS.md, why: Quality, planning, delegation, and cleanup rules. }
    - { path: docs/plans/2026-08-05-issues-44-48.yaml, why: Executable task and verification plan. }
    - { path: docs/specs/2026-08-05-issues-44-48-spec.md, why: REQ and acceptance source. }
    - {
        path: docs/flow-charts/2026-08-05-issues-44-48-flow-chart.yaml,
        why: Current and target event paths.,
      }
    - {
        path: docs/logic-maps/2026-08-05-issues-44-48-logic-map.yaml,
        why: Decisions failures teardown persistence and gates.,
      }
    - { path: docs/plans/plan-template.yaml, why: Plan lineage. }
    - { path: docs/plans/checking_plan_plan-template.yaml, why: Checking-plan lineage. }
  conditional_required:
    - {
        when: checking implementation,
        paths:
          [
            packages/shared-types,
            apps/api/src,
            apps/api/prisma,
            apps/desktop/src,
            apps/ios/0dteTrader,
            apps/ios/0dteTraderTests,
          ],
        why: Verify claims in actual code and tests.,
      }
  read_order: [core_required, conditional_required]

instructions:
  - Update this file immediately when a task starts, a RED or GREEN test runs, a finding appears, remediation lands, or evidence changes.
  - Inspect diffs and rerun fresh commands; never accept an agent report as proof.
  - For every behavior task require RED evidence before production edits, GREEN focused evidence after, then independent spec and quality reviews.
  - Record severity, file/symbol, reproduction, invariant impact, minimal fix, blocker, and remediation status for each finding.
  - Convert every risk to an in-scope code/test/doc change or an explicit residual-risk entry.
  - Block completion on unresolved P0/P1, failed required checks, obsolete code, missing physical-iPhone Energy Log, or missing GitHub #45 capability comment.
  - Issue 46 is deleted/withdrawn and must not acquire invented implementation requirements.

scope:
  include_globs:
    [
      packages/shared-types/**,
      apps/api/src/**,
      apps/api/prisma/**,
      apps/desktop/src/**,
      apps/ios/0dteTrader/**,
      apps/ios/0dteTraderTests/**,
      apps/ios/project.yml,
      docs/**,
    ]
  exclude_globs: [node_modules/**, build/**, dist/**, .artifacts/**]
  default_target: plan_ref

variables:
  pr_base: origin/main
  pr_head: HEAD
  plan_path_glob: docs/plans/2026-08-05-issues-44-48.yaml
